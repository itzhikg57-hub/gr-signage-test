<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GR PERFUME Digital Signage – הדגמה</title>
<style>
  /* בכוונה בלי CSS Grid ובלי משתני CSS – לתאימות לדפדפנים ישנים */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0e0f12; color: #f3efe6;
    font-family: "Segoe UI", "Assistant", "Heebo", Arial, sans-serif; }
  * { -webkit-box-sizing: border-box; box-sizing: border-box; }

  .flex { display: -webkit-box; display: -webkit-flex; display: flex; }
  .col { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
  .grow { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; min-height: 0; }
  .center { -webkit-align-items: center; align-items: center; }

  #app { width: 100%; height: 100%; padding: 2.2rem 2.844rem;
    background: -webkit-radial-gradient(85% 0%, ellipse, #2a2418 0%, #0e0f12 55%);
    background: radial-gradient(ellipse at 85% 0%, #2a2418 0%, #0e0f12 55%); }

  /* ---------- כותרת ---------- */
  #header { height: 9rem; -webkit-justify-content: space-between; justify-content: space-between;
    border-bottom: 1px solid rgba(212,175,55,0.25); margin-bottom: 2rem; }
  .logo { font-size: 4.2rem; letter-spacing: 0.5rem; font-weight: 300; color: #d4af37; direction: ltr; }
  .logo b { font-weight: 700; }
  .logo small { display: block; font-size: 1.5rem; letter-spacing: 0.9rem; color: #a99a74; margin-top: 0.3rem; }
  .client { font-size: 2.2rem; color: #a99a74; }
  .demo-badge { font-size: 1.6rem; color: #0e0f12; background: #d4af37; padding: 0.4rem 1rem;
    border-radius: 0.6rem; margin-right: 1.5rem; font-weight: bold; }

  /* ---------- גוף ---------- */
  #main { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-height: 0; }
  #side { width: 48rem; margin-left: 2.844rem; }
  .card { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 1.6rem; padding: 2rem 2rem; margin-bottom: 1.8rem; }
  #side .card:last-child { margin-bottom: 0; }

  .time { font-size: 11rem; font-weight: 200; line-height: 1; direction: ltr; text-align: right; }
  .time .sec { font-size: 4.5rem; color: #d4af37; margin-left: 0.6rem; }
  .day { font-size: 3.4rem; margin-top: 1.4rem; color: #d4af37; }
  .date { font-size: 2.6rem; color: #cfc6b2; margin-top: 0.5rem; }

  .w-top { -webkit-justify-content: space-between; justify-content: space-between; }
  .w-city { font-size: 2.4rem; color: #cfc6b2; }
  .w-temp { font-size: 8rem; font-weight: 200; line-height: 1; }
  .w-desc { font-size: 2.4rem; color: #cfc6b2; margin-top: 0.6rem; }
  .w-icon svg { width: 10rem; height: 10rem; }
  .w-days { margin-top: 1.8rem; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1.4rem;
    -webkit-justify-content: space-between; justify-content: space-between; }
  .w-day { text-align: center; font-size: 1.9rem; color: #cfc6b2; }
  .w-day svg { width: 4.4rem; height: 4.4rem; display: block; margin: 0.4rem auto; }
  .w-day b { color: #f3efe6; font-weight: 400; }

  .msg-title { font-size: 1.9rem; color: #d4af37; letter-spacing: 0.3rem; margin-bottom: 1rem; }
  #msgText { font-size: 2.4rem; line-height: 1.45; -webkit-transition: opacity .6s; transition: opacity .6s; }

  /* ---------- אזור פרסומות ---------- */
  #ads { position: relative; border-radius: 2rem; overflow: hidden; background: #000;
    border: 1px solid rgba(212,175,55,0.2); }
  .slide { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0;
    -webkit-transition: opacity 1s; transition: opacity 1s;
    padding: 7rem 8.889rem; }
  .slide.on { opacity: 1; }
  .slide h2 { font-size: 7.5rem; font-weight: 300; margin: 0 0 2rem 0; line-height: 1.15; }
  .slide p { font-size: 3rem; margin: 0; color: rgba(255,255,255,0.85); max-width: 70%; line-height: 1.4; }
  .slide .tag { display: inline-block; font-size: 2rem; padding: 0.6rem 1.6rem; border: 1px solid rgba(255,255,255,0.5);
    border-radius: 3rem; margin-bottom: 3rem; letter-spacing: 0.3rem; }
  .slide .deco { position: absolute; left: 10.667rem; bottom: 6rem; width: 26rem; height: 26rem; opacity: 0.9; }
  .s1 { background: -webkit-linear-gradient(135deg, #3b2f1a, #0f0d09); background: linear-gradient(135deg, #3b2f1a, #0f0d09); }
  .s2 { background: -webkit-linear-gradient(135deg, #1b2b2a, #0a1212); background: linear-gradient(135deg, #1b2b2a, #0a1212); }
  .s3 { background: -webkit-linear-gradient(135deg, #2c1d26, #0f0a0d); background: linear-gradient(135deg, #2c1d26, #0f0a0d); }
  .s4 { background: -webkit-linear-gradient(135deg, #1c2233, #0a0c12); background: linear-gradient(135deg, #1c2233, #0a0c12); }
  #progress { position: absolute; bottom: 0; right: 0; height: 0.6rem; background: #d4af37; width: 0; }
  #dots { position: absolute; bottom: 2.4rem; right: 8.889rem; }
  #dots span { display: inline-block; width: 1.2rem; height: 1.2rem; border-radius: 50%;
    background: rgba(255,255,255,0.3); margin-left: 1rem; }
  #dots span.on { background: #d4af37; }

  /* ---------- פס חדשות ---------- */
  #ticker { height: 7rem; margin-top: 2rem; border-radius: 1.4rem; overflow: hidden;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); }
  .t-label { background: #d4af37; color: #0e0f12; font-weight: bold; font-size: 2.5rem;
    height: 100%; padding: 0 2.4rem; }
  .t-viewport { position: relative; height: 100%; overflow: hidden; }
  #tickerText { position: absolute; top: 0; height: 100%; white-space: nowrap; font-size: 2.7rem;
    line-height: 7rem; right: 0; }
  #tickerText .sep { color: #d4af37; margin: 0 2.5rem; }

  /* ---------- מצב אנכי (גדלים לפי רוחב המסך) ---------- */
  body.portrait #app { padding: 1.406rem 1.688rem; }
  body.portrait #header { height: auto; padding-bottom: 1.125rem; margin-bottom: 1.688rem; }
  body.portrait .logo { font-size: 3.038rem; white-space: nowrap; }
  body.portrait .logo small { font-size: 1.125rem; letter-spacing: 0.562rem; }
  body.portrait .demo-badge { font-size: 1.125rem; white-space: nowrap; padding: 0.337rem 0.787rem; margin-right: 1.125rem; }
  body.portrait #client { display: none; }
  body.portrait #headClock { display: block !important; }
  body.portrait #headClock .time { font-size: 5.625rem; }
  body.portrait #headClock .date { font-size: 1.575rem; text-align: left; margin-top: 0.281rem; }
  body.portrait #main { -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; }
  body.portrait #ads { -webkit-order: 1; order: 1; border-radius: 1.688rem; }
  body.portrait #side { width: 100%; height: 23.625rem; margin: 1.688rem 0 0 0; -webkit-order: 2; order: 2;
    -webkit-box-orient: horizontal; -webkit-flex-direction: row; flex-direction: row; }
  body.portrait #side .card { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; margin: 0 0 0 1.688rem;
    padding: 1.688rem; border-radius: 1.406rem; }
  body.portrait #side .card:last-child { margin-left: 0; }
  body.portrait #side .card.clock { display: none; }
  body.portrait .slide { padding: 4.5rem 3.938rem; }
  body.portrait .slide .tag { font-size: 1.463rem; padding: 0.562rem 1.35rem; border-radius: 2.25rem; margin-bottom: 2.25rem; }
  body.portrait .slide h2 { font-size: 4.5rem; margin-bottom: 1.688rem; }
  body.portrait .slide p { font-size: 2.025rem; max-width: 100%; }
  body.portrait .slide .deco { width: 16.875rem; height: 16.875rem; left: 3.938rem; bottom: 5.625rem; }
  body.portrait #dots { bottom: 2.25rem; right: 3.938rem; }
  body.portrait #dots span { width: 1.012rem; height: 1.012rem; margin-left: 0.9rem; }
  body.portrait #progress { height: 0.45rem; }
  body.portrait .w-city { font-size: 1.8rem; }
  body.portrait .w-temp { font-size: 5.062rem; }
  body.portrait .w-desc { font-size: 1.688rem; }
  body.portrait .w-icon svg { width: 6.188rem; height: 6.188rem; }
  body.portrait .w-days { margin-top: 1.125rem; padding-top: 1.125rem; }
  body.portrait .w-day { font-size: 1.35rem; }
  body.portrait .w-day svg { width: 2.812rem; height: 2.812rem; }
  body.portrait .msg-title { font-size: 1.463rem; margin-bottom: 0.844rem; }
  body.portrait #msgText { font-size: 2.025rem; }
  body.portrait #ticker { height: 5.062rem; margin-top: 1.688rem; border-radius: 1.125rem; }
  body.portrait .t-label { font-size: 1.912rem; padding: 0 1.688rem; }
  body.portrait #tickerText { font-size: 2.025rem; line-height: 5.062rem; }
</style>
</head>
<body>
<div id="app" class="flex col">

  <div id="header" class="flex center">
    <div class="flex center">
      <div class="logo"><b>GR</b> PERFUME<small>SCENT SOLUTIONS</small></div>
      <span class="demo-badge">הדגמה · נתונים לדוגמה</span>
    </div>
    <div id="headClock" style="display:none; text-align:left">
      <div class="time" id="time2"></div>
      <div class="date" id="date2"></div>
    </div>
    <div class="client" id="client"></div>
  </div>

  <div id="main" class="flex">
    <!-- עמודה צדדית: שעון, מזג אוויר, הודעות -->
    <div id="side" class="flex col">
      <div class="card clock">
        <div class="time" id="time"></div>
        <div class="day" id="day"></div>
        <div class="date" id="date"></div>
      </div>
      <div class="card">
        <div class="flex center w-top">
          <div>
            <div class="w-city" id="wCity"></div>
            <div class="w-temp" id="wTemp"></div>
            <div class="w-desc" id="wDesc"></div>
          </div>
          <div class="w-icon" id="wIcon"></div>
        </div>
        <div class="flex w-days" id="wDays"></div>
      </div>
      <div class="card grow">
        <div class="msg-title">הודעות</div>
        <div id="msgText"></div>
      </div>
    </div>

    <!-- אזור פרסומות -->
    <div id="ads" class="grow">
      <div id="slides"></div>
      <div id="dots"></div>
      <div id="progress"></div>
    </div>
  </div>

  <div id="ticker" class="flex center">
    <div class="t-label flex center">חדשות</div>
    <div class="t-viewport grow"><div id="tickerText"></div></div>
  </div>
</div>

<script>
/* =========================================================
   GR PERFUME DIGITAL SIGNAGE – תצוגת הדגמה
   ES5 בלבד (בלי let/const/חצים) כדי לעבוד גם על WebView ישן.
   כל הנתונים כאן הם נתוני הדגמה. בשלב 4 הם יגיעו מממשק הניהול.
   פרמטרים בכתובת:
     ?screen=1 / ?screen=2   – תוכן שונה לכל מסך
     ?orientation=portrait   – כפיית תצוגה אנכית לבדיקה
   ========================================================= */
(function () {

  // ---------- נתוני הדגמה לכל מסך ----------
  var SCREENS = {
    "1": {
      client: "מסך 01 · לובי משרדים",
      weather: { city: "תל אביב", temp: 24, desc: "בהיר", icon: "sun",
        days: [["חמישי", "sun", 25, 17], ["שישי", "partly", 23, 16], ["שבת", "cloud", 21, 15]] },
      messages: [
        "ברוכים הבאים! שיהיה לכם יום נעים ומוצלח.",
        "תזכורת: ביום שלישי בין 10:00 ל-12:00 תתבצע תחזוקה במעליות.",
        "חניון האורחים פתוח עד השעה 20:00."
      ]
    },
    "2": {
      client: "מסך 02 · חדר כושר",
      weather: { city: "ירושלים", temp: 17, desc: "מעונן חלקית", icon: "partly",
        days: [["חמישי", "partly", 18, 10], ["שישי", "rain", 14, 9], ["שבת", "cloud", 15, 9]] },
      messages: [
        "שעות פעילות: א׳–ה׳ 06:00–23:00, ו׳ 07:00–15:00.",
        "אל תשכחו מגבת ובקבוק מים 💧",
        "שיעור ספינינג חדש בימי שני ב-19:00."
      ]
    }
  };

  var ADS = [
    { cls: "s1", tag: "GR PERFUME", title: "ריח שמשאיר רושם", text: "פתרונות ריח מקצועיים למשרדים, מלונות, חדרי כושר וחנויות.", dur: 8, deco: "drop" },
    { cls: "s2", tag: "חדש", title: "קולקציית החורף", text: "ניחוחות חמים של עץ, וניל ותבלינים לחורף נעים.", dur: 7, deco: "leaf" },
    { cls: "s3", tag: "מבצע לדוגמה", title: "חודש ראשון במתנה", text: "ללקוחות עסקיים חדשים: התקנה ושירות ללא עלות בחודש הראשון.", dur: 7, deco: "gift" },
    { cls: "s4", tag: "שירות", title: "טכנאי מגיע אליכם", text: "מילוי וטיפול תקופתי במכשירים, בלי שתצטרכו לחשוב על זה.", dur: 6, deco: "drop" }
  ];

  var NEWS = [
    "זוהי כותרת חדשות לדוגמה. בשלב 6 יתחברו מקורות אמיתיים",
    "מזג האוויר: התחממות קלה בסוף השבוע",
    "כותרת לדוגמה: נפתח מרכז קניות חדש בעיר",
    "כותרת לדוגמה: עליה במספר התיירים בחורף"
  ];

  // ---------- עזרים ----------
  function $(id) { return document.getElementById(id); }
  function qs(name) {
    var m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // אפשר גם דרך # (למשל #screen-2 או #screen-2-portrait)
  var H = location.hash || "";
  var screenId = qs("screen") || (H.indexOf("screen-2") > -1 ? "2" : "1");
  if (!qs("orientation") && H.indexOf("portrait") > -1) { location.search === "" && (window.__forcePortrait = true); }
  var S = SCREENS[screenId] || SCREENS["1"];

  // ---------- כיוון מסך + סיבוב ----------
  // rotate=90 / rotate=270 (או #rotate-90 / #rotate-270): למקרה שהמכשיר מדווח "לרוחב"
  // אבל המסך עומד פיזית לאורך – הדף מסובב את עצמו.
  var rot = qs("rotate") || (H.indexOf("rotate-90") > -1 ? "90" : (H.indexOf("rotate-270") > -1 ? "270" : null));
  function applyOrientation() {
    var app = $("app");
    var w = window.innerWidth, h = window.innerHeight;
    if (rot === "90" || rot === "270") {
      var t = "rotate(" + rot + "deg)";
      app.style.position = "absolute";
      app.style.width = h + "px"; app.style.height = w + "px";
      app.style.top = ((h - w) / 2) + "px"; app.style.left = ((w - h) / 2) + "px";
      app.style.webkitTransform = t; app.style.transform = t;
      var tmp = w; w = h; h = tmp;
    }
    // 1rem = 1% מגובה המסך הלוגי (עובד גם כשהדף מסובב)
    document.documentElement.style.fontSize = (h / 100) + "px";
    var forced = qs("orientation");
    var portrait = forced ? forced === "portrait" : (window.__forcePortrait || h > w);
    document.body.className = portrait ? "portrait" : "landscape";
  }
  applyOrientation();
  window.addEventListener("resize", applyOrientation);
  window.addEventListener("hashchange", function () { location.reload(); });

  // ---------- שעון ותאריך (שמות עבריים ידניים, לא תלוי ב-Intl) ----------
  var DAYS = ["יום ראשון", "יום שני", "יום שלישי", "יום רביעי", "יום חמישי", "יום שישי", "שבת"];
  var MONTHS = ["בינואר", "בפברואר", "במרץ", "באפריל", "במאי", "ביוני", "ביולי", "באוגוסט", "בספטמבר", "באוקטובר", "בנובמבר", "בדצמבר"];
  function tick() {
    var d = new Date();
    var t = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("time").innerHTML = t + "<span class='sec'>" + pad(d.getSeconds()) + "</span>";
    $("time2").innerHTML = t;
    $("day").innerHTML = DAYS[d.getDay()];
    var full = d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
    $("date").innerHTML = full;
    $("date2").innerHTML = DAYS[d.getDay()] + " · " + full;
  }
  tick();
  setInterval(tick, 1000);

  // ---------- אייקוני מזג אוויר (SVG פנימי, בלי הורדות) ----------
  var ICONS = {
    sun: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="12" fill="#f4c542"/><g stroke="#f4c542" stroke-width="3" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="58"/><line x1="6" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="19.3" y2="19.3"/><line x1="44.7" y1="44.7" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="19.3" y2="44.7"/><line x1="44.7" y1="19.3" x2="50.4" y2="13.6"/></g></svg>',
    partly: '<svg viewBox="0 0 64 64"><circle cx="24" cy="24" r="10" fill="#f4c542"/><path d="M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-26 4 8 8 0 0 0 0 16z" fill="#dfe3ea"/></svg>',
    cloud: '<svg viewBox="0 0 64 64"><path d="M16 48h32a11 11 0 0 0 0-22 16 16 0 0 0-30 4 9 9 0 0 0-2 18z" fill="#c9ced8"/></svg>',
    rain: '<svg viewBox="0 0 64 64"><path d="M16 38h32a11 11 0 0 0 0-22 16 16 0 0 0-30 4 9 9 0 0 0-2 18z" fill="#c9ced8"/><g stroke="#6fb3ff" stroke-width="3" stroke-linecap="round"><line x1="22" y1="44" x2="19" y2="54"/><line x1="33" y1="44" x2="30" y2="54"/><line x1="44" y1="44" x2="41" y2="54"/></g></svg>'
  };
  var DECO = {
    drop: '<svg viewBox="0 0 100 100"><path d="M50 8 C50 8 20 46 20 64 a30 30 0 0 0 60 0 C80 46 50 8 50 8z" fill="none" stroke="rgba(212,175,55,0.7)" stroke-width="1.5"/><path d="M50 26 C50 26 32 50 32 63 a18 18 0 0 0 36 0 C68 50 50 26 50 26z" fill="rgba(212,175,55,0.12)"/></svg>',
    leaf: '<svg viewBox="0 0 100 100"><path d="M20 80 C20 30 60 15 85 15 C85 45 70 80 20 80z" fill="none" stroke="rgba(160,220,200,0.7)" stroke-width="1.5"/><path d="M20 80 L70 30" stroke="rgba(160,220,200,0.5)" stroke-width="1.2"/></svg>',
    gift: '<svg viewBox="0 0 100 100" fill="none" stroke="rgba(240,180,210,0.7)" stroke-width="1.5"><rect x="18" y="40" width="64" height="44" rx="3"/><rect x="12" y="28" width="76" height="14" rx="2"/><line x1="50" y1="28" x2="50" y2="84"/><path d="M50 28 C40 10 24 18 34 28 M50 28 C60 10 76 18 66 28"/></svg>'
  };

  // ---------- מזג אוויר (הדגמה) ----------
  var W = S.weather;
  $("client").innerHTML = S.client;
  $("wCity").innerHTML = W.city;
  $("wTemp").innerHTML = W.temp + "°";
  $("wDesc").innerHTML = W.desc;
  $("wIcon").innerHTML = ICONS[W.icon];
  var dh = "";
  for (var i = 0; i < W.days.length; i++) {
    var dd = W.days[i];
    dh += "<div class='w-day'>" + dd[0] + ICONS[dd[1]] + "<b>" + dd[2] + "°</b> / " + dd[3] + "°</div>";
  }
  $("wDays").innerHTML = dh;

  // ---------- הודעות מתחלפות ----------
  var mi = 0;
  function showMsg() {
    var el = $("msgText");
    el.style.opacity = 0;
    setTimeout(function () {
      el.innerHTML = S.messages[mi % S.messages.length];
      el.style.opacity = 1;
      mi++;
    }, 600);
  }
  showMsg();
  setInterval(showMsg, 9000);

  // ---------- פרסומות מתחלפות ----------
  var sh = "", doth = "";
  for (var a = 0; a < ADS.length; a++) {
    var ad = ADS[a];
    sh += "<div class='slide " + ad.cls + "'><span class='tag'>" + ad.tag + "</span><h2>" + ad.title +
          "</h2><p>" + ad.text + "</p><div class='deco'>" + DECO[ad.deco] + "</div></div>";
    doth += "<span></span>";
  }
  $("slides").innerHTML = sh;
  $("dots").innerHTML = doth;
  var slides = $("slides").children, dots = $("dots").children, cur = -1, timer = null;
  var prog = $("progress");

  function next() {
    if (cur >= 0) { slides[cur].className = slides[cur].className.replace(" on", ""); dots[cur].className = ""; }
    cur = (cur + 1) % slides.length;
    slides[cur].className += " on";
    dots[cur].className = "on";
    var dur = ADS[cur].dur;
    // פס התקדמות
    prog.style.webkitTransition = "none"; prog.style.transition = "none"; prog.style.width = "0";
    setTimeout(function () {
      prog.style.webkitTransition = "width " + dur + "s linear"; prog.style.transition = "width " + dur + "s linear";
      prog.style.width = "100%";
    }, 50);
    clearTimeout(timer);
    timer = setTimeout(next, dur * 1000);
  }
  next();

  // ---------- פס חדשות נע ----------
  var tt = $("tickerText");
  var html = "";
  for (var n = 0; n < NEWS.length; n++) html += NEWS[n] + "<span class='sep'>◆</span>";
  tt.innerHTML = html + html; // כפול כדי שהגלילה תהיה רציפה
  var pos = 0, last = Date.now();
  function scroll() {
    var now = Date.now(), dt = (now - last) / 1000; last = now;
    var half = tt.offsetWidth / 2;
    pos += dt * $("app").offsetHeight * 0.09; // מהירות יחסית לגובה המסך
    if (pos >= half) pos -= half;
    var tr = "translateX(" + pos + "px)";
    tt.style.webkitTransform = tr; tt.style.transform = tr;
    (window.requestAnimationFrame || function (f) { setTimeout(f, 33); })(scroll);
  }
  scroll();

})();
</script>
</body>
</html>
